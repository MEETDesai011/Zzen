allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Dynamic namespace injection script for third-party libraries lacking AGP 8.0+ compliance
subprojects { project ->
    def setNamespace = {
        if (project.hasProperty("android")) {
            if (project.android.namespace == null) {
                project.android.namespace = "dev.flutter.plugins.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
            }
        }
    }
    if (project.state.executed) {
        setNamespace()
    } else {
        project.afterEvaluate {
            setNamespace()
        }
    }
}

// Fix: Override Kotlin JVM target for all plugins (app_usage compatibility)
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("kotlin-android") || project.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
            project.android {
                kotlinOptions {
                    jvmTarget = "17"
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
